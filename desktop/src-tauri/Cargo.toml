[package]
name = "tazuna-desktop"
version = "0.1.47"
edition = "2021"
description = "tazuna desktop (docs/DESKTOP.md)"
license = "MIT"

# its own build, apart from the CLI's crate in the repository root
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
