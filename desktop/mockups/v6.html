<span class="u">example.com/a/really/long/url/that/goes/on…</span> and <s>struck</s> text.

<span class="ok">☑</span> done item
<span class="f">☐</span> open item

<span class="ok">✓ Done</span>  <span class="f">6 s · $0</span>

<div style="border-top:1px solid #3a3731;margin-top:4px;padding-top:2px;display:flex"><span class="a">›</span>&nbsp;<span class="f i">say something…</span><span style="flex:1"></span><span class="ok">✓ done</span></div></div></div></div>
    <ul class="notes"><li>Default only for people who never picked one: <b>your own choice (cockpit, kept in ~/.local/share/tazuna/design) stays</b>. Today a new user gets aurora, and someone with runs but no saved choice gets cockpit.</li>
    <li>Ctrl-T still cycles all four; nothing is removed.</li><li>Not in this proposal: the transcript's own wording ("· started on Mock Model · medium · lean profile (set on the command line; no repo config)").</li></ul></div>`;
  return `<div class="cli"><h2>The terminal's default design: zen, aurora, cockpit</h2>
    <p>The same session in each, on a scripted model (no cost), 120×36 and at 80×24. Today a new user gets <b>aurora</b>, someone with runs and no saved choice <b>cockpit</b>; Claude Code, Codex, pi and OpenCode all open on a transcript with one status line, which is <b>zen</b>.</p>
    <div class="cgrid"><span></span><span class="h">Zen <small>proposed default</small></span><span class="h">Aurora <small>default for new users today</small></span><span class="h">Cockpit <small>your saved choice</small></span>
    ${states.map(([s, n]) => `<span class="st">${n}</span>${img("zen", s)}${img("aurora", s)}${img("cockpit", s)}`).join("")}</div></div>`;
}

// ── the panel ─────────────────────────────────────────────────────────────────────────────────────────────────────
const SCREENS = { titles: ["Sidebar and titles", { now: "Now", a: "A · titles, two lines", b: "B · titles, one line", c: "C · B, repeats folded" }],
  review: ["Review", { now: "Now", a: "A · unified, in the window", b: "B · split", c: "C · focus (no sidebar)" }],
  usage: ["Usage", { now: "Now", a: "A · simpler" }], cli: ["Terminal", { compare: "Compare the designs", tweaked: "Zen, with fixes" }] };
const NOTES = {
  titles: "Titles: the first message made short, by rules on this machine (filler like \"can you please\" dropped, the first clause, at most ~6 words, a capital first). No model call, no tokens. The full first message stays the conversation's first block, and shows after the title in the header. Date groups replace the age on every row; the model leaves the row (it is in the conversation and its hover). C folds a question asked again and again into one row with its count.",
  review: "A pane in the window, not a dialog: Esc goes back to the conversation. Words that changed are marked inside the line. Hover a line for + to comment; comments collect and go to the agent as one message (Send 2 comments). Stage and Revert per hunk and per file, in words. Split shows old and new side by side.",
  usage: "Right now: windows with no use this week fold into one line, providers without a balance into another (their pages one click away). Spending as it is. \"How the runs went\" (clear misses, pushback) is for tuning tazuna: folded at the bottom. Click the folded rows to open them.",
  cli: "Screens from the real terminal on the scripted model. \"Zen, with fixes\" draws three changes by hand next to zen as it is.",
};
function render() {
  document.body.className = S.theme;
  const app = document.getElementById("app");
  app.innerHTML = { titles: titlesScreen, review: reviewScreen, usage: usageScreen, cli: cliScreen }[S.screen]();
  const [, vs] = SCREENS[S.screen];
  const key = S.screen;
  document.getElementById("proto").innerHTML = `<span class="min" data-min>–</span><b>Screen</b><div class="opts">${Object.entries(SCREENS).map(([k, [n]]) => `<button data-s="${k}" class="${S.screen === k ? "on" : ""}">${n}</button>`).join("")}</div>
    <b>Variant</b><div class="opts">${Object.entries(vs).map(([k, n]) => `<button data-v="${k}" class="${S[key] === k ? "on" : ""}">${n}</button>`).join("")}</div>
    <b>Theme</b><div class="opts"><button data-t="dark" class="${S.theme === "dark" ? "on" : ""}">Dark</button><button data-t="light" class="${S.theme === "light" ? "on" : ""}">Light</button></div><p>${NOTES[S.screen]}</p>`;
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-s],[data-v],[data-t],[data-act],[data-min]");
  if (!t) return;
  if (t.dataset.s) S.screen = t.dataset.s;
  if (t.dataset.v) S[S.screen] = t.dataset.v;
  if (t.dataset.t) S.theme = t.dataset.t;
  if (t.dataset.act === "idle") S.idle = !S.idle;
  if (t.dataset.act === "runq") S.runq = !S.runq;
  if (t.dataset.min !== undefined) { document.getElementById("proto").classList.toggle("small"); return; }
  render();
});
// a link can open a state directly: v6.html#screen=review&review=b&theme=light
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in S) S[k] = v === "true" ? true : v === "false" ? false : v;
render();
</script>
</body>
