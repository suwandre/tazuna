<!-- Design review 12 (2026-11-22). Two questions, each a switch with the app as it is as one option:
     A. the title bar: today the traffic lights, the sidebar's brand row and the sheet's header are three heights;
     B. an open work panel and the reading column: today the column jumps left when the panel opens.
     The window is drawn from DESIGN.md's tokens and the bundled fonts, at the real window's sizes (1440×900, 1280×800,
     the minimum 960×600). The traffic lights are drawn where macOS puts them (A1: the default; A2, A3: moved with
     Tauri's `trafficLightPosition`). The panel at the bottom right switches variants; a link opens a state

};
const ic = (n, c = "") => `<svg class="ico ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const MARK = '<path d="M16.2 4.6Q12.4 6 7.6 6.4"/><path d="M7.2 10.2h9.6M5.4 14.2h13.2"/><path d="M12 6.2v11.3a2 2 0 1 1-2.6-1.9"/>';
const mark = (size) => `<span class="tile" style="width:${size}px;height:${size}px"><svg viewBox="0 0 24 24" width="${Math.round(size * .8)}" height="${Math.round(size * .8)}" stroke-width="${size <= 16 ? 2.4 : 2.2}">${MARK}</svg></span>`;
const hair = '<span class="hair"></span>';
const dn = `<svg class="ico dn" viewBox="0 0 24 24">${P.down}</svg>`;

// ── geometry: where each variant puts the rows, the sheet, the column ───────────────────────────────────────────────
// A1: the real window today. A2: the sheet's header centred on the lights' row (lights moved to y 28). A2 alt: a toolbar
// on the desk across the window, the sheet under it. A3: the sheet runs to the top edge, its header is the title bar.
function geom() {
  const W = +S.w, H = SIZES[W], narrow = W < 1000, a = S.a;
  const sheetTop = a === "a3" ? 0 : a === "a2b" ? 0 : 8;   // a2b: the sheet's top is under the 48 px toolbar
  const hh = { a1: 48, a2: 40, a2b: 0, a3: 44 }[a];          // the sheet's header row
  const rowY = { a1: 16, a2: 28, a2b: 24, a3: 22 }[a];       // the lights' centre
  const lx = a === "a1" ? 10 : 20;                           // A1: macOS's default inset; A2, A3: trafficLightPosition x 20
  const sheetL = narrow ? 8 : 248, sheetR = W - 8;            // the sheet with the panel shut
  const closedW = sheetR - sheetL;
  const docL = Math.max(0, (closedW - 756) / 2);             // the column's box (28 px padding each side) as centring puts it
  let mode = S.open ? S.b : "shut", textW = 700, fallback = 0;
  if (mode === "b3") {
    textW = Math.min(700, closedW - 300 - docL - 56);        // the panel takes 300 px from the sheet's right
    if (textW < 580) { fallback = textW; mode = "b2"; }       // under 580 px the column would read cramped: B2 instead
  }
  const docked = mode === "b1" || mode === "b3";
  return { W, H, narrow, a, sheetTop, hh, rowY, lx, sheetL, closedW, docL, mode, textW, fallback, docked, textX: sheetL + docL + 28 };
}

// ── pieces ───────────────────────────────────────────────────────────────────────────────────────────────────────────
const row = (t, s, age, on) => `<div class="row ${on ? "on" : ""}"><div class="t">${t}</div><div class="s"><span>${s}</span><span class="age">${age}</span></div></div>`;
function sidebar(g) {
  let top;
  if (g.a === "a1") top = `<div data-drag style="height:38px;flex:none;margin:0 -10px"></div><div class="brand" data-drag>${mark(22)}<span>tazuna</span></div>
      <div class="search nodrag">${ic("search", "s")}Search<kbd>⌘K</kbd></div>`;
  else if (g.a === "a2") top = `<div class="trow" data-drag style="height:48px;margin:0 -10px 8px;padding:8px 0 0 84px"><span class="brand">${mark(20)}<span>tazuna</span></span></div>
      <div class="search nodrag">${ic("search", "s")}Search<kbd>⌘K</kbd></div>`;
  else if (g.a === "a2b") top = `<div class="search nodrag">${ic("search", "s")}Search<kbd>⌘K</kbd></div>`;
  else top = `<div class="trow" data-drag style="height:44px;margin:0 -10px 6px;padding:0 10px 0 84px"><span class="search nodrag">${ic("search", "s")}Search<kbd>⌘K</kbd></span></div>`;
  return `<aside class="side" style="${g.a === "a2b" ? "padding-top:8px" : ""}">${top}
    <div class="act">${ic("plus")}New chat</div><div class="act">${ic("folder")}Open folder</div>
    <div class="list">
      <div class="grp"><span>Today</span></div>
      ${row("The retry test fails on CI but passes locally", "api-gateway", "now", true)}${row("Names for a grey cat", "chat", "1h")}${row("Test", "chat", "2h")}
      ${row("Why is the CI build so slow?", "api-gateway", "3h")}
      <div class="grp"><span>Yesterday</span></div>${row("Refund for a train ticket", "chat", "11:09pm")}
      <div class="grp"><span>This week</span></div>${row("Question 1: what about edge cases?", "chat", "Wed")}${row("Speed up the CI build", "api-gateway", "Sun")}
      <div class="grp"><span>Projects</span></div><div class="act">${ic("right", "s")}api-gateway</div>
    </div>
    <div class="settings"><div class="act">${ic("gear")}Settings</div></div>
  </aside>`;
}
function crumbs(g) {
  const tg = g.narrow ? `<span class="tg nodrag" style="${g.a === "a1" ? "margin-left:-12px" : ""}" title="Conversations">${ic("panelL")}</span>` : "";
  return `${tg}<span class="crumb">api-gateway</span><span class="faint">/</span><span class="ttl">The retry test fails on CI but passes locally</span><span class="full">— Can you find out why and fix it?</span>`;
}
function buttons(g) {
  const on = S.open && g.mode !== "b2";
  return `<span class="hb nodrag"><span title="Side chat">${ic("side")}</span><span class="${S.open ? "on" : ""}" data-k="open" data-val="${!S.open}" title="The work panel (⌘\\)">${ic("panel")}</span></span>`;
}
function statusBar(g) {
  return `<div class="sbar"><span class="sdot"></span>Claude<span class="faint" style="margin-left:6px">5h</span><span class="meter"><i style="width:36%"></i></span><b>36%</b><span class="faint" style="margin-left:6px">2h 14m</span>
    ${hair}<span class="faint">wk</span><span class="meter"><i class="w" style="width:79%"></i></span><b>79%</b><span class="faint" style="margin-left:6px">1d 2h</span>
    <span style="margin-left:10px;color:var(--faint)">${ic("refresh", "xs")}</span>
    <span class="sp"></span><span class="faint">context</span>&nbsp;<b>9%</b>&nbsp;<span class="faint">of 200k</span>${hair}<span class="faint">cache</span>&nbsp;<b>32%</b>${hair}<span class="faint">this chat</span>&nbsp;<b>$0.052</b>${hair}
    <span class="ver faint">${g.a === "a3" ? mark(14) : ""}tazuna 0.1.102</span></div>`;
}
function transcript() {
  return `
    <div class="prose"><p>So the second attempt and the test's wait race each other: whichever comes first decides the run, and CI's runners are slower than this machine.</p></div>
    <div class="meta">${ic("right", "s")}<b>$0.012</b>${hair}9.8k in<span class="q">(61% cached)</span>${hair}310 out${hair}4 s</div>
    <div class="you">Make the wait follow the backoff, and keep the test under a second.</div>
    <div class="fold">${ic("right", "s")}Worked 5 s${hair}edited 2 files, ran 2 commands</div>
    <div class="prose">
      <p>The test waited a fixed 100 ms for the second attempt, but the backoff starts at 80 ms with up to 25% jitter, so on a slow runner the attempt lands after the wait:</p>
      <table class="tbl"><tr><th>Runner</th><th class="r">Second attempt</th><th class="r">Test waited</th><th>Result</th></tr>
        <tr><td>This machine</td><td class="r">84 ms</td><td class="r">100 ms</td><td class="ok">passes</td></tr>
        <tr><td>CI, median</td><td class="r">97 ms</td><td class="r">100 ms</td><td class="ok">passes</td></tr>
        <tr><td>CI, slowest 10%</td><td class="r">112 ms</td><td class="r">100 ms</td><td class="bad">fails</td></tr></table>
      <p>The test now waits for the longest the backoff can take, read from the same schedule, on fake timers, so the runner's speed no longer matters:</p>
      <div class="code"><div class="ch"><span>ts</span><span>${ic("copy", "s")}Copy</span></div><pre><span class="cm">// src/retry.ts</span>
<span class="k">export const</span> maxDelay = (n: <span class="k">number</span>) =&gt; base(n) * <span class="num">1.25</span>;

<span class="cm">// tests/retry.test.ts</span>
<span class="k">await</span> vi.advanceTimersByTimeAsync(maxDelay(<span class="num">1</span>));
expect(calls).toBe(<span class="num">2</span>);</pre></div>
      <p>The suite passed twice in a row: 48 tests, the retry test in 0.2 s.</p>
    </div>
    <div class="cc">
      <div class="f">${ic("file", "s")}<span class="p">src/retry.ts</span><span class="n"><span class="ok">+2</span> <span class="bad">−1</span></span><span class="btn">Diff</span></div>
      <div class="f">${ic("file", "s")}<span class="p">tests/retry.test.ts</span><span class="n ok">+3</span><span class="btn">Diff</span></div>
      <div class="ft">2 files changed in this turn<span class="btn">Review</span><span class="btn">Undo</span></div>
    </div>
    <div class="meta">${ic("right", "s")}<b>$0.031</b>${hair}15.0k in<span class="q">(32% cached)</span>${hair}800 out${hair}5 s</div>`;
}
function panelBody() {
  return `<div class="sec"><h4>${ic("branch")}Changes<span class="n"><span class="ok">+5</span> <span class="bad">−1</span></span></h4>
      <div class="br">master</div>
      <div class="fr"><span>src/retry.ts</span><span class="n"><span class="ok">+2</span> <span class="bad">−1</span></span></div>
      <div class="fr"><span>tests/retry.test.ts</span><span class="n ok">+3</span></div>
      <span class="btn">Review</span></div>
    <div class="sec"><h4>Your messages<span class="n faint">3</span></h4>
      <div class="m">The retry test fails on CI but passes locally. Can you find out why and fix it?</div>
      <div class="m">Show me where the 100 ms comes from</div>
      <div class="m">Make the wait follow the backoff, and keep the test under a second.</div></div>`;
}

// ── the window ───────────────────────────────────────────────────────────────────────────────────────────────────────
function win(g) {
  const cols = [g.narrow ? null : "248px", "minmax(0, 1fr)", g.docked ? "300px" : null].filter(Boolean).join(" ");
  const r = g.a === "a3" ? "0 0 12px 12px" : "12px";
  const mainStyle = `margin:${g.sheetTop}px ${g.docked ? 0 : 8}px 0 ${g.narrow ? 8 : 0}px;border-radius:${r}`;
  // the header's left padding clears the lights when they sit over the sheet (narrow window, A2 and A3)
  const pl = g.narrow && g.a !== "a1" ? 76 : 28;
  const head = g.a === "a2b" ? "" : `<div class="head" data-drag style="height:${g.hh + 1}px;padding-left:${pl}px">${crumbs(g)}${buttons(g)}</div>`;
  const tabTop = g.hh + 13;
  const tab = g.docked ? "" : `<span class="ptab ${S.open ? "on" : ""}" style="top:${tabTop}px" data-k="open" data-val="${!S.open}" title="The work panel (⌘\\)">${ic("branch")}Changes<b>2</b></span>`;
  // the column: centred (shut, B1, B2), or kept where centring put it with the panel shut (B3)
  const b3 = g.mode === "b3";
  const docStyle = b3 ? `margin:0 0 0 ${g.docL}px;max-width:none;width:${g.textW + 56}px` : "";
  const boxStyle = b3 ? `margin:0 0 18px ${g.docL + 28}px;width:${g.textW}px` : "";
  const bar = g.a !== "a2b" ? "" : `<div class="tbar" data-drag>${g.narrow ? `<div class="tmain" style="padding-left:84px">${crumbs(g)}${buttons(g)}</div>`
    : `<div class="tside"><span class="brand" style="padding:0;gap:8px">${mark(20)}<span>tazuna</span></span></div><div class="tmain">${crumbs(g)}${buttons(g)}</div>`}</div>`;
  const railTop = g.a === "a2b" ? 14 : g.sheetTop + g.hh / 2 - 10;   // the panel's first heading on the header's row
  const rail = g.docked ? `<aside class="rail" style="padding-top:${railTop}px">${panelBody()}</aside>` : "";
  const sheetY = g.a === "a2b" ? 48 : g.sheetTop;
  const pop = g.mode === "b2" ? `<div class="pop" id="pop" style="right:20px;top:${sheetY + tabTop + 34}px">${panelBody()}</div>` : "";
  const guide = S.guide && S.open ? `<div class="guide" style="left:${g.textX - 5}px;top:${sheetY}px;bottom:28px"><span>the column with the panel shut</span></div>` : "";
  const lights = `<div class="lights" style="left:${g.lx}px;top:${g.rowY - 6}px"><i></i><i></i><i></i></div>`;
  return `<div class="win">${bar}
    <div class="cols" style="grid-template-columns:${cols}">${g.narrow ? "" : sidebar(g)}
      <main class="main" style="${mainStyle}">${head}${tab}
        <div class="scroll fade" id="scroll"><div class="doc" style="${docStyle}">${transcript()}</div></div>
        <div class="composer" style="${boxStyle}"><div>Ask anything, or describe a change…&nbsp; / for commands, @ for files</div>
          <div class="pills"><span class="pill">${ic("shield")}auto${dn}</span><span class="pill">${ic("zap")}Opus 5.5<span class="hair" style="margin:0 1px"></span><span class="lvl">high</span>${dn}</span><span class="clip">${ic("clip")}</span><span class="send">${ic("up", "s")}</span></div></div>
      </main>${rail}
    </div>${statusBar(g)}${pop}${guide}${lights}</div>`;
}

// ── render and the switch panel ──────────────────────────────────────────────────────────────────────────────────────
const NOTES = {
  a1: "A1, today: the lights in macOS's 32 px strip (y 16), the brand row under them (y 51), the sheet's header between (y 32). Narrow (960): the lights sit on the sheet's corner, over the header's sidebar button.",
  a2: "A2: one row at y 28 across the window. The lights move down and in (trafficLightPosition x 20, y 22), the brand beside them, the sheet keeps its 8 px top and its header is 40 px, centred on the same line. The sheet still carries its title.",
  a2b: "A2 alt: a 48 px toolbar on the desk (lights, brand, the title, the buttons), the sheet under it with no header of its own. The T3 / Claude layout; the title is no longer on the paper.",
  a3: "A3: the sheet runs to the window's top edge; its 44 px header is the title bar (y 22). The brand row goes: Search takes its place beside the lights; the mark moves to the status bar beside the version (and stays on the start screen and the app icon).",
};
const BNOTES = {
  shut: "Panel shut: the “Changes 2” tab on the sheet's edge, as it will be when the panel stops opening by itself.",
  b1: () => "B1, today: the sheet narrows by 300 px and the column re-centres: its left edge jumps (the dashed line is where it was).",
  b2: () => "B2: the panel floats over the conversation (the pop elevation), under its tab; nothing moves. Esc, a click outside, the tab or ⌘\\ shut it.",
  b3: (g) => `B3: the column keeps its left edge and gives up width on the right (700 → ${g.mode === "b3" ? g.textW : "–"} px here); the panel lies on the desk as now. Under 580 px of column (a window under 1372 px, or any without the sidebar) it falls back to B2.`,
};
function fit() { const f = document.getElementById("frame"), st = f.parentElement, w = +S.w, h = SIZES[w]; f.style.width = w + "px"; f.style.height = h + "px"; f.style.transform = `translate(-50%, -50%) scale(${Math.min(1, (st.clientWidth - 32) / w, (st.clientHeight - 32) / h)})`; }
function render() {
  const pm = document.body.classList.contains("pmin");
  document.body.className = `${S.theme} ${pm ? "pmin" : ""} ${S.shot ? "shot" : ""} ${S.drag ? "showdrag" : ""}`;
  const g = geom();
  document.getElementById("frame").innerHTML = win(g);
  const sc = document.getElementById("scroll"); if (sc) sc.scrollTop = sc.scrollHeight;
  fit(); panel(g);
}
function panel(g) {
  const btn = (k, v, n, dis) => `<button data-k="${k}" data-val="${v}" class="${String(S[k]) === String(v) ? "on" : ""}" ${dis ? "disabled" : ""}>${n}</button>`;
  const sw = (title, k, opts) => `<b>${title}</b><div class="opts">${opts.map(([v, n, d]) => btn(k, v, n, d)).join("")}</div>`;
  const fb = g.fallback ? `<div class="note">B3 at ${g.W}: the column would be ${g.fallback} px, so it falls back to B2.</div>` : "";
  document.getElementById("proto").innerHTML = `<span class="min" data-min>–</span>
    ${sw("A · title bar", "a", [["a1", "A1 today"], ["a2", "A2 one row"], ["a2b", "A2 alt: toolbar"], ["a3", "A3 sheet to the top"]])}
    ${sw("Work panel", "open", [[false, "Shut (tab)"], [true, "Open"]])}
    ${sw("B · open panel and the column", "b", [["b1", "B1 today"], ["b2", "B2 over the sheet"], ["b3", "B3 column stays"]])}${fb}
    ${sw("Theme", "theme", [["dark", "Dark"], ["light", "Light"]])}
    ${sw("Window", "w", [["1440", "1440 × 900"], ["1280", "1280 × 800"], ["960", "960 × 600"]])}
    ${sw("Marks", "drag", [[false, "Off"], [true, "Drag regions"]])}
    ${sw("Column guide (panel open)", "guide", [[true, "On"], [false, "Off"]])}
    <b>Recommended</b><div class="keep">A2 (one row, the sheet whole) with B3 (the column stays; B2 where it cannot).</div>
    <b>What to look at</b><ol><li>${NOTES[S.a]}</li><li>${S.open ? BNOTES[g.mode](g) : BNOTES.shut}</li>
    ${S.drag ? "<li>Hatched: <code>data-tauri-drag-region</code>, on the element itself (Tauri ignores its children, so buttons and the search stay clickable; the title's spans should carry it too, so a drag on the title moves the window). The desk between the parts is the grid's region, as now.</li>" : ""}</ol>`;
}
document.addEventListener("click", (e) => {
  const mn = e.target.closest("[data-min]"); if (mn) { document.getElementById("proto").classList.toggle("small"); document.body.classList.toggle("pmin"); fit(); return; }
  const t = e.target.closest("[data-k]");
  if (t) { const v = t.dataset.val; S[t.dataset.k] = v === "true" ? true : v === "false" ? false : v; if (t.dataset.k === "b") S.open = true; }
  else if (S.open && geom().mode === "b2" && e.target.closest("#frame") && !e.target.closest("#pop")) S.open = false;   // B2: a click outside shuts it
  else return;
  location.hash = new URLSearchParams(Object.entries(S).filter(([k]) => k !== "shot").map(([a, b]) => [a, String(b)])).toString();
  render();
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open && geom().mode === "b2") { S.open = false; location.hash = location.hash.replace("open=true", "open=false"); render(); } });
addEventListener("resize", fit);
// a link opens a state: v9.html#a=a3&b=b3&open=true&theme=light&w=1440 (shot=true: the window alone, for screenshots)
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in S) S[k] = v === "true" ? true : v === "false" ? false : v;
render();
</script>
</body>
</html>
