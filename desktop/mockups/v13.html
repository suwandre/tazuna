<!-- Design review 14, follow-up (2026-11-26), built from v12.html. Not the app.
     Decided after v12, drawn as the base with no switch: the placeholder "/ for commands, @ for files"; the pills keep their
     icons (MessageCircle or Folder, Shield, Zap) with no fill, a hairline on hover, sentence case ("Chat", "Auto"); Stats as
     tiles; the accent Ai (v12's S5, its dark `selected` at 16% on the sheet: #303638, faint on it 4.56:1, ink 10.0:1); the
     system UI face (v12's S6); the 16 px working mark with the shimmer; the Brain and Zap icons; the slip's tile and "Receipt".

     Two open questions, on the panel at the bottom right:
     Q1, the conversation numbers: one box, the composer's full width, 32 px, 12.5 px text; each part a button that opens the
       work panel at Stats (Conversation). M-A: a strip that is the composer's footer, inside its border. M-B: a box under
       the composer, 6 px apart, its own hairline. M-C: the same box above it. Parts: context (Gauge, "19.9k of 128k", a bar,
       the %), the conversation's cost (Coins, "$0.0038 this chat"; "free" on a local model, "not billed" on a plan), the
       cache (Database, "94% cached"; left out where the provider reports none, as Ollama), the reply's speed while it runs
       (Activity, "28 t/s", appended at the end so nothing moves when a reply starts or ends). The numbers start at the
       composer's text edge, under the pills' icons. The route line (news) has two places on a switch: its own line under
       the composer as today (the default: the numbers need ~545 px running, the box has 686 at 1000 px, so they always fit
       whole), or the box's left side (the numbers then go right). Where the row is short it drops, in turn: the cache, the
       cost's words, the route line's model name ("DeepSeek V4.1 Flash on": the pill says it), "of 128k"; last the route
       line ends in "…" (its whole text on hover). With the route line in the box this happens at 1440 px already.
       The start page has no numbers: no box (route line on its own line), or the box with the route line alone.
       Settings › Appearance › Conversation numbers: Under the box, Above the box, In the status bar, Off (a Segmented; it
       works: pick one and the window behind changes). Under the box draws M-A or M-B, whichever was picked last; above,
       M-C (or the strip as the composer's header, after M-A). In the status bar: the numbers back there, the box gone, the
       route line back under the composer. Each number shows once: with the box, the status bar has no context, cache or cost.
     Q2, the start page: S1-current (the mark, "What are we working on?", the ledger line, composer, cards) or S1-C (the
       mark; "14 runs today" as the serif headline; "$0.41 paid | 94% from the cache" under it at the ledger's size; on a day
       with no run the current question and its line).

     A link opens a state: v13.html#screen=run&theme=light&style=box&place=under&w=1000&news=1 (shot=1: the window alone,
     for screenshots; the clock stands still). Screens: start, startp, done, run, settings. Models: paid, free, plan.

     Numbers: v12's turn on DeepSeek V4.1 Flash ($0.30 in / $0.03 cached / $1.20 out per million, a 128k window), every
     figure computed from its calls. Finished: 20.3k of 128k, $0.0053, 95% cached. Running at 12 s (four calls done):
     19.9k of 128k, $0.0038, 94% cached, 28 t/s. The free case is the same turn on Qwen3 Coder 30B in Ollama (32k window,
     no cache reported); the plan case on Sonnet 5.5 on the Claude plan (200k window). -->

// the composer's pills: where (start pages), mode, model; icons, no fill

// ── Q1: the conversation numbers ─────────────────────────────────────────────────────────────────────────────────────
// the route line: what is new about the model (a paid one's price a message); its model name is the first thing to go
function newsOf(kind) {

function numbers(sm, running) {

  const seg = (cls, title, inner) => `<span class="mseg ${cls}"><button class="mp" data-act="meter" title="${title} · opens Stats">${inner}</button></span>`;
  const out = [
    seg("p-ctx", `Context: ${tok(sm.ctx)} of this model's ${m.win} window, ${pct}%`,
      `${ic("gauge", "s")}<span class="v">${tok(sm.ctx)}</span><span class="w ctxof">of ${m.win}</span><span class="mbar"><i style="width:${pct}%"></i></span><span class="w">${pct}%</span>`),
    seg("p-cost", m.price ? `This conversation's cost, ${usd(sm.cost)} ${running ? "so far" : ""}` : m.word === "free" ? "A local model: nothing paid" : "On your Claude plan: not billed",
      `${ic("coins", "s")}<span class="v">${costSaid(sm)}</span><span class="w costw">${m.price ? "this chat" : m.sub}</span>`),
  ];
  if (m.cache) out.push(seg("p-cache", `${share(sm.hit)} of the input came from the provider's cache`, `${ic("database", "s")}<span class="v">${share(sm.hit)}</span><span class="w">cached</span>`));
  if (running) out.push(seg("p-tps", "The reply's writing speed now", `${ic("activity", "s live")}<span class="v" data-live="tps">${live.tps}</span><span class="w">t/s</span>`));
  return out.join("");
}
function meterRow(sm, running, news, cls = "") {
  const nums = sm ? numbers(sm, running) : "";
  if (!nums && !news) return "";
  const n = news ? `<span class="mnews" title="${news.model}${news.rest}">${ic("arrow", "s", "color:var(--faint)")}<span class="tx"><span class="nmodel">${news.model}</span>${news.rest}</span></span>` : "";
  return `<div class="mrow ${cls}">${n}${nums ? `<span class="mnums">${nums}</span>` : ""}</div>`;
}
// where the row is short: drop the cache, then the cost's words, the route line's model name, "of 128k"; then the route line ends in "…"
const DROPS = [".p-cache", ".costw", ".nmodel", ".ctxof"];
function fitMeters() {
  document.querySelectorAll(".mrow").forEach((row) => {
    row.classList.remove("squeeze"); row.querySelectorAll(DROPS.join(",")).forEach((e) => (e.hidden = false));
    for (const sel of DROPS) { if (row.scrollWidth <= row.clientWidth) break; row.querySelectorAll(sel).forEach((e) => (e.hidden = true)); }
    if (row.scrollWidth > row.clientWidth) row.classList.add("squeeze");
  });
}
function composer({ where, busy, sm = null, running = false, news = null, style = "" }) {

  const row = boxed ? meterRow(sm, running, inBox ? news : null, strip ? `strip ${S.place === "above" ? "top" : ""}` : "") : "";

// ── the work panel: Stats as tiles (decided) ──────────────────────────────────────────────────────────────────────────
function sparkPath(vals, max, w, h) {

  return vals.map((v, i) => `${i ? "L" : "M"}${(n < 2 ? w / 2 : i * w / (n - 1)).toFixed(1)},${(h - (v / hi) * h).toFixed(1)}`).join("");
}

    <i style="position:absolute;right:4px;top:${4 + 26 - (vals[vals.length - 1] / (max ?? Math.max(...vals) * 1.1)) * 26}px;width:7px;height:7px;margin:-3.5px -3.5px 0 0;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--desk)"></i></div>`;
  return `<div class="tiles">

      <div class="box"><div class="l">Out</div><div class="v">${tok(sm.out)}</div><div class="s"><span ${running ? 'data-live="tps"' : ""}>${running ? live.tps : Math.round(sm.tps)}</span> t/s writing</div></div>
      <div class="box"><div class="l">Cost</div><div class="v">${costSaid(sm)}</div><div class="s">${!m.price ? m.sub : running ? "so far" : m.payee}</div></div>

    <div class="box metric"><div class="top"><span class="l">Time to first token</span><span class="v2">${secs(sm.perTtft[sm.n - 1])}</span><span class="s">median ${secs(sm.ttftMed)}</span></div>${spark(sm.perTtft)}</div>
    <div class="box metric"><div class="top"><span class="l">Writing speed</span><span class="v2">${Math.round(sm.perTps[sm.n - 1])} t/s</span><span class="s">median ${Math.round(median(sm.perTps))} t/s</span></div>${spark(sm.perTps)}</div>

}

// ── render, the live clock and the switch panel ───────────────────────────────────────────────────────────────────────
const size = () => S.w === "1000" ? [1000, 800] : [1440, 900];
function fit() {
  const f = document.getElementById("frame"), st = f.parentElement, [w, h] = size();
  f.style.width = w + "px"; f.style.height = h + "px";
  if (S.shot) { f.style.transform = ""; return; }
  f.style.transform = `translate(-50%, -50%) scale(${Math.min(1, (st.clientWidth - 32) / w, (st.clientHeight - 32) / h)})`;
}
function render() {
  const pm = document.body.classList.contains("pmin");
  document.body.className = [S.theme, pm ? "pmin" : "", S.shot ? "shot" : ""].join(" ");
  const f = document.getElementById("frame");
  f.innerHTML = S.screen === "start" ? startWin(false) : S.screen === "startp" ? startWin(true) : conversation(S.screen === "run");
  fit(); fitMeters(); panel();
  const sc = document.getElementById("scroll"); if (sc) sc.scrollTop = sc.scrollHeight;
  location.replace("#" + new URLSearchParams(Object.entries(S).filter(([k, v]) => k !== "shot" || v).map(([a, b]) => [a, typeof b === "boolean" ? (b ? "1" : "0") : b])).toString());
}
// the running reply's clock: its seconds count, its speed moves; the numbers ease to their new values (450 ms)
function tween(el, to) {
  const from = parseFloat(el.textContent) || to, t0 = performance.now();
  const step = (t) => { const p = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const JITTER = [0, 1, -1, 0, 1, 0, -1, 1];
setInterval(() => {
  if (S.shot || S.screen !== "run") return;
  live.secs++; live.tps = 28 + JITTER[live.secs % JITTER.length];
  document.querySelectorAll('[data-live="secs"]').forEach((el) => (el.textContent = `${live.secs} s`));
  document.querySelectorAll('[data-live="tps"]').forEach((el) => tween(el, live.tps));
}, 1000);
function panel() {
  const b = (k, v, n) => `<button data-k="${k}" data-val="${v}" class="${String(S[k]) === String(v) ? "on" : ""}">${n}</button>`;
  const row = (title, k, opts) => `<b>${title}</b><div class="opts">${opts.map(([v, n]) => b(k, v, n)).join("")}</div>`;
  const variant = (id, style, place, n) => `<button data-variant="${style}|${place}" class="${S.style === style && S.place === place ? "on" : ""}">${id} ${n}</button>`;
  const conv = !S.screen.startsWith("start");
  document.getElementById("proto").innerHTML = `<span class="min" data-min>–</span><h3>Design review 14 · v13: numbers and start</h3>
    ${row("Screen", "screen", [["start", "Start: chat"], ["startp", "Start: project"], ["done", "Finished"], ["run", "Running"], ["settings", "Settings"]])}
    ${row("Theme", "theme", [["dark", "Dark"], ["light", "Light"]])}
    ${row("Window", "w", [["1440", "1440 × 900"], ["1000", "1000 × 800"]])}
    <b>Q1 · Conversation numbers</b><div class="opts">${variant("M-A", "strip", "under", "strip, footer")}${variant("M-B", "box", "under", "box under")}${variant("M-C", "box", "above", "box above")}</div>
    ${row("The setting (place)", "place", PLACES)}
    ${row("Model", "model", [["paid", "Paid (DeepSeek)"], ["free", "Free (local)"], ["plan", "Plan (Claude)"]])}
    ${row("Route line, where", "newsAt", [["line", "Its own line, under the box"], ["box", "The box's left side"]])}
    ${conv ? row("Route line (→ model, price a message)", "news", [[false, "Hidden (nothing new)"], [true, "Shown (a paid model)"]]) + row("Work panel", "panel", [[false, "Shut"], [true, "Open (or click a number)"]]) : ""}
    <b>Q2 · Start page</b><div class="opts">${b("start", "cur", "S1-current")}${b("start", "c", "S1-C: runs as headline")}</div>
    ${!conv ? row("The day", "day", [["busy", "14 runs"], ["new", "No run yet"]]) + row("Mode", "mode", [["auto", "Auto"], ["full", "Full · never asks"]]) : ""}
    <div class="note">Click a number (or the status bar's, placed there) to open Stats; the fold, the receipt line, the Changes tab. In Settings the Conversation numbers keys work.</div>`;
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-min]")) { document.getElementById("proto").classList.toggle("small"); document.body.classList.toggle("pmin"); fit(); return; }
  const v = e.target.closest("[data-variant]"); if (v) { [S.style, S.place] = v.dataset.variant.split("|"); render(); return; }
  const t = e.target.closest("[data-k]");
  if (t) { const x = t.dataset.val; S[t.dataset.k] = x === "true" ? true : x === "false" ? false : x; if (t.dataset.k === "newsAt") S.news = true; if (t.dataset.k === "screen") { S.panel = false; live = { secs: RUN.at, tps: 28 }; } render(); return; }
  const a = e.target.closest("[data-act]"); if (!a || !a.dataset.act) return;
  const act = a.dataset.act;
  if (act === "fold") S.fold = !S.fold; else if (act === "slip") S.slip = !S.slip;
  else if (act === "panel") S.panel = !S.panel;
  else if (act === "meter") { S.panel = true; S.scope = "all"; }
  else if (act === "place") S.place = a.dataset.v;
  else if (act === "scope-turn") S.scope = "turn"; else if (act === "scope-all") S.scope = "all";
  render();
});
addEventListener("resize", fit);
document.fonts.ready.then(fitMeters);
// a link opens a state
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in S) S[k] = typeof S[k] === "boolean" ? v === "1" || v === "true" : v;
render();
</script>
</body>
</html>
