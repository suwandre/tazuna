<!-- Design review 14 (2026-11-26). Theme: take out the looks that read as machine-made, or as one more ChatGPT / Claude.ai /
     T3 Code clone, and keep what is tazuna's own (paper on the desk, the torn slip, the document transcript, the fold line,
     plain step verbs, the warn-tinted full-mode pill, the status bar's account names, the 手 mark).
     Nine switches, each the app as it is ("current", drawn after the r14 screenshots at 1440×900) or the proposal; the
     panel at the bottom right sets them, the screen, the theme, and "all current" / "all proposed". A fourth screen shows
     the terminal before and after. The window is drawn from DESIGN.md's tokens and the bundled fonts. Not the app.

     A link opens a state: v12.html#screen=done&theme=light&s5=new&slip=1 (shot=1: the window alone at 1440×900, for
     screenshots; the clock stands still). Screens: start, startp, done, run, panel (calls=2|12), term.

     Numbers: one turn on DeepSeek V4.1 Flash (DeepSeek, paid, $0.30 in / $0.03 cached / $1.20 out per million, a 128k
     window), every figure computed from its calls, so the receipt, the slip, the meter and Stats agree on each screen. The
     brief's "$0.031" cannot come from 15.0k in and 800 out at those prices ($0.0042), so the turn is drawn as a real agent's:
     ~19k of context a call, most of it from DeepSeek's cache. Finished: "$0.0053 | 98.2k in (95% cached) | 800 out | 34 s".
     Running, at 12 s (four calls done, the answer being written): "19.9k of 128k · $0.0038 · 94% cached · 28 t/s · ↓ 156".
     Screen 5's "2 calls" and "12 calls" are the same turn made in 2 calls (its four tools asked for at once) and in 12.

     Choices the brief left open: S3 on also takes "context" off the status bar (the meter has it: each number once); the
     start page keeps the "→ … about $0.0004 a message" line under the box (no conversation yet, so no meter); S9's one
     Total is the table's totals row, the payee and "without the cache" on one faint line under it. Interactive only: the
     pills' hairline on hover (S2), the meter opening Stats and the numbers easing while a reply runs (S3, S4), the mark

// ── the terminal: before / after, cell by cell in the terminal's palette (src/ui/mod.rs DARK / LIGHT) ─────────────────
const TP = {
  dark: { bg: "#171613", surface: "#211f1b", field: "#2a2823", border: "#3a3731", text: "#ece8df", ink2: "#d2cdc2", dim: "#afaa9e", faint: "#9a958d", accent: "#8f9bf0", warn: "#e0b46a", err: "#e08b7f", ok: "#7cc08f" },
  light: { bg: "#f6f4ef", surface: "#fffefb", field: "#efebe3", border: "#d8d2c5", text: "#23221e", ink2: "#3f3c35", dim: "#5b574f", faint: "#69655d", accent: "#3d4aa8", warn: "#a76a14", err: "#b4473a", ok: "#3b7d4f" },
};
const COLS = 92;
const mixc = (a, b, t) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
const seglen = (segs) => segs.reduce((n, [t = "", , o = {}]) => n + (o.w2 ? 2 : [...t].length), 0);
const lr = (left, right) => [...left, [" ".repeat(Math.max(1, COLS - seglen(left) - seglen(right)))], ...right];
function term(lines, theme) {
  const P = TP[theme], col = (c) => (c in P ? P[c] : c);
  const rows = lines.map((ln) => {
    const segs = Array.isArray(ln) ? ln : ln.segs, band = Array.isArray(ln) ? null : ln.band;
    let used = 0;
    const spans = segs.map(([text = "", fg = "text", o = {}]) => {
      const st = [`color:${col(fg)}`]; if (o.bg) st.push(`background:${col(o.bg)}`); if (o.b) st.push("font-weight:700"); if (o.i) st.push("font-style:italic");
      if (o.w2) { used += 2; return `<span class="w2 ${o.pulse ? "tpulse" : ""}" style="${st.join(";")};--sh-hi:${P.accent};--sh-base:${mixc(P.accent, P.bg, .45)}">${text}</span>`; }
      used += [...text].length;
      if (o.shimmer) return `<span class="tsh" style="${st.join(";")}">${[...text].map((ch, i) => `<span style="--sh-base:${col(fg)};--sh-hi:${P.accent};animation-delay:${i * 90}ms">${ch}</span>`).join("")}</span>`;
      return `<span style="${st.join(";")}">${text.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`;
    }).join("");
    return `<div class="tl" style="${band ? `background:${col(band)}` : ""}">${spans}<span>${" ".repeat(Math.max(0, COLS - used))}</span></div>`;
  }).join("");
  return `<div class="tw"><div class="pad" style="background:${P.bg}"><div class="tc" style="color:${P.text}">${rows}</div></div></div>`;
}
const RULE = [["─".repeat(COLS), "border"]];
const PROMPT = [["› ", "accent"], ["say something…", "faint", { i: true }]];
const head = (model, right = "≈$0") => lr([["tazuna", "faint", { i: true }]], [[model, "dim"], ["    "], [right, "text", { b: true }]]);
const LOGO = [[" "], ["▐", "accent"], ["手", "bg", { bg: "accent", w2: true }], ["▌", "accent"], [" "], ["tazuna", "text", { b: true }], [" 0.1.227", "dim"]];
const PATH = [["      /private/tmp/tzrev/r14/projcli", "text"], ["  on ", "dim"], ["master", "text", { b: true }]];
const YOU = (t) => ({ band: "surface", segs: [["▎ ", "accent"], [t, "text", { b: true }]] });
const DONE = [["✓ Done", "ok", { b: true }], ["  2 s  $0   ", "dim"], ["main.rs ", "text"], ["+2", "ok"], [" −1", "err"], ["  NOTES.md ", "text"], ["+3", "ok"], ["   ctrl-o diffs", "faint"]];
const ANSWER_T = [
  [["Done. The greeting now says ", "text"], ["hello, tazuna", "text", { b: true }], [", on two lines:", "text"]], [],
  [["• ", "dim"], ["main.rs", "text", { b: true, bg: "field" }], [": the ", "text"], ["println!", "text", { b: true, bg: "field" }], [" changed, and a second line added", "text"]],
  [["• ", "dim"], ["NOTES.md", "text", { b: true, bg: "field" }], [": new, a note on the change", "text"]], [],
  [["cat nope.txt", "text", { b: true, bg: "field" }], [" failed because the file does not exist; nothing depends on it.", "text"]], [],
];
// the status line's right end: today dots ("● auto   ● ready"), proposed coloured words
const AUTO = (now) => now ? [[" ● ", "ok", { bg: "surface" }], ["auto ", "dim", { bg: "surface" }]] : [["auto", "ok"]];
const STATE = (now, word, color, dotColor = color) => now ? [["  ● ", dotColor], [word, color]] : [["   " + word, color]];
function TERM(now) {
  const w = [
    head("Sonnet 5.5 medium"), [], LOGO, PATH, [],
    now ? [["      Try \"how is this repo laid out?\", or /keys for every key", "dim"]] : [["      lean profile · 3 tracked files · /keys for every key", "dim"]],
    RULE, lr(PROMPT, [...AUTO(now), ...STATE(now, "ready", "dim")]),
  ];
  const working = [
    YOU("change the greeting to hello tazuna"), [],
    now ? [["⠸ ", "accent"], ["thinking", "dim"]] : [["thinking", "dim"]], [],
    now ? [["手", "accent", { w2: true, pulse: true }], [" "], ["Working", "text", { b: true, shimmer: true }], ["  2 s · ↓ 20 tokens · thinking", "faint"]]
      : [["手", "accent", { w2: true, pulse: true }], [" "], ["Working", "text", { b: true }], ["  2 s · ↓ 20 tokens · thinking", "faint"]],
    RULE, lr(PROMPT, [...AUTO(now), ...(now ? [["  ⠸ working", "accent"]] : [["   working", "accent"]]), [" · esc stops", "faint"]]),
  ];
  const done = [
    YOU("change the greeting to hello tazuna"), [],
    now ? [["⌁ ", "faint"], ["thinking", "dim"]] : [["thinking", "dim"]], [],
    [["I'll look at the folder first.", "text", { b: true }]], [],
    [...(now ? [["⌁ ", "faint"]] : []), ["ran 4 tools", "dim"], ["   bash ×2  edit ×1  write ×1   12 lines   thought ~20 tok   ", "faint"], ["1 failed", "err"]], [],
    ...ANSWER_T, DONE, RULE, lr(PROMPT, [...AUTO(now), ...(now ? [["  ✓ done", "ok"]] : [["   done", "ok"]])]),
  ];
  const approval = now ? [
    DONE, [], YOU("guard: clean and push"), [],
    [["⌁ ", "faint"], ["ran 1 tool", "dim"], ["   bash ×1   8 lines", "faint"]],
    [["? ", "warn", { b: true }], ["bash", "text", { b: true }], ["   git push --force origin main", "dim"], ["  · waits for your answer", "faint"]], [],
    RULE,
    [["? allow bash?", "warn", { b: true }]],
    [["  once only · auto asks: git push --force: rewrites the remote's", "dim"]],
    [["  history", "dim"]],
    [["  git push --force origin main", "text"]],
    lr([["  y ", "accent", { b: true }], ["allow once", "text", { b: true }], ["   n ", "accent", { b: true }], ["no", "text", { b: true }]], [...AUTO(true), ...STATE(true, "needs you", "warn")]),
  ] : [
    DONE, [], YOU("guard: clean and push"), [],
    [["ran 1 tool", "dim"], ["   bash ×1   8 lines", "faint"]],
    [["? ", "warn", { b: true }], ["bash", "text", { b: true }], ["   git push --force origin main", "dim"], ["  · waits for your answer", "faint"]], [], [],
    RULE,
    [["? Allow this command?", "warn", { b: true }]],
    [["  git push --force rewrites the remote's history", "dim"]],
    [["  git push --force origin main", "text"]],
    lr([["  y ", "accent", { b: true }], ["allow", "text", { b: true }], ["   n ", "accent", { b: true }], ["decline", "text", { b: true }]], [...AUTO(false), ...STATE(false, "needs you", "warn")]),
  ];
  return { w, working, done, approval };
}
function termPage() {
  const th = S.theme, A = TERM(true), B = TERM(false);
  const row = (k, label) => `<div class="lab">${label}</div><div class="lab new">${label}, proposed</div>${term(A[k], th)}${term(B[k], th)}`;
  return `<div class="tpage"><h1>The terminal, today and proposed</h1>
    <div class="lede">Left: tazuna 0.1.227 (the r14 captures). Right: its own welcome line, no ✻ or ⌁ (the 手 pulse alone marks work), coloured words for the status dots, the question as one. The ▎ bar and the Done line stay.</div>
    <div class="tgrid">${row("w", "Start")}${row("working", "Working")}${row("done", "Done")}${row("approval", "An approval")}</div></div>`;
}

// ── render, the live clock and the switch panel ───────────────────────────────────────────────────────────────────────
function fit() { const f = document.getElementById("frame"), st = f.parentElement; if (S.shot) { f.style.transform = ""; return; } f.style.transform = `translate(-50%, -50%) scale(${Math.min(1, (st.clientWidth - 32) / 1440, (st.clientHeight - 32) / 900)})`; }
function render() {
  const pm = document.body.classList.contains("pmin");
  document.body.className = [S.theme, NEW("s5") ? "acc-ai" : "", NEW("s6") ? "ui-sys" : "", pm ? "pmin" : "", S.shot ? "shot" : ""].join(" ");
  const f = document.getElementById("frame");
  f.innerHTML = S.screen === "start" ? startWin(false) : S.screen === "startp" ? startWin(true) : S.screen === "term" ? termPage() : conversation(S.screen === "run");
  const sc = document.getElementById("scroll"); if (sc) sc.scrollTop = sc.scrollHeight;
  fit(); panel();
  location.replace("#" + new URLSearchParams(Object.entries(S).filter(([k, v]) => k !== "shot" || v).map(([a, b]) => [a, typeof b === "boolean" ? (b ? "1" : "0") : b])).toString());
}
// the running reply's clock: its seconds count, its speed moves; the numbers ease to their new values (450 ms)
function tween(el, to) {
  const from = parseFloat(el.textContent) || to, t0 = performance.now();
  const step = (t) => { const p = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const JITTER = [0, 1, -1, 0, 1, 0, -1, 1];
setInterval(() => {
  if (S.shot || S.screen !== "run") return;
  live.secs++; live.tps = 28 + JITTER[live.secs % JITTER.length];
  document.querySelectorAll('[data-live="secs"]').forEach((el) => el.textContent = `${live.secs} s`);
  document.querySelectorAll('[data-live="tps"]').forEach((el) => tween(el, live.tps));
}, 1000);
function panel() {
  const b = (k, v, n) => `<button data-k="${k}" data-val="${v}" class="${String(S[k]) === String(v) ? "on" : ""}">${n}</button>`;
  const row = (title, k, opts) => `<b>${title}</b><div class="opts">${opts.map(([v, n]) => b(k, v, n)).join("")}</div>`;
  const sub = S.screen === "panel" ? row("Stats data", "calls", [["2", "2 calls"], ["12", "12 calls"]])
    : S.screen.startsWith("start") ? row("The day", "day", [["busy", "14 runs"], ["new", "A new day"]]) + row("Mode", "mode", [["auto", "Auto"], ["full", "Full · never asks"]])
    : S.screen === "done" ? row("Steps / slip / panel", "fold", [[false, "Fold shut"], [true, "Fold open"]]) + `<div class="opts" style="margin-top:4px">${b("slip", false, "Slip shut")}${b("slip", true, "Slip open")}${b("panel", false, "Panel shut")}${b("panel", true, "Panel open")}</div>`
    : S.screen === "run" ? row("Work panel", "panel", [[false, "Shut"], [true, "Open (or click the meter)"]]) : "";
  const allCur = SW.every(([k]) => S[k] === "cur"), allNew = SW.every(([k]) => S[k] === "new");
  document.getElementById("proto").innerHTML = `<span class="min" data-min>–</span><h3>Design review 14 · less machine-made</h3>
    ${row("Screen", "screen", [["start", "1 Start: chat"], ["startp", "2 Start: project"], ["done", "3 Finished"], ["run", "4 Running"], ["panel", "5 Work panel"], ["term", "Terminal"]])}
    ${sub}
    ${row("Theme", "theme", [["dark", "Dark"], ["light", "Light"]])}
    <b>Switches</b><div class="opts" style="margin-bottom:4px"><button data-all="cur" class="${allCur ? "on" : ""}">All current</button><button data-all="new" class="${allNew ? "on" : ""}">All proposed</button></div>
    ${SW.map(([k, n, where]) => `<div class="sw ${S[k] === "new" ? "flip" : ""}"><span class="nm">${n}<small>${where}</small></span><span class="opts">${b(k, "cur", "Current")}${b(k, "new", "Proposed")}</span></div>`).join("")}
    <div class="note">${S.screen === "term" ? "The terminal shows today and the proposal side by side; the switches are for the window." : "Click the fold line, the receipt line, the Changes tab, the header's panel button, or (S3) the meter."}</div>`;
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-min]")) { document.getElementById("proto").classList.toggle("small"); document.body.classList.toggle("pmin"); fit(); return; }
  const all = e.target.closest("[data-all]"); if (all) { for (const [k] of SW) S[k] = all.dataset.all; render(); return; }
  const t = e.target.closest("[data-k]");
  if (t) { const v = t.dataset.val; S[t.dataset.k] = v === "true" ? true : v === "false" ? false : v; if (t.dataset.k === "screen") { S.panel = false; live = { secs: RUN.at, tps: 28 }; } render(); return; }
  const a = e.target.closest("[data-act]"); if (!a || !a.dataset.act) return;
  const act = a.dataset.act;
  if (act === "fold") S.fold = !S.fold; else if (act === "slip") S.slip = !S.slip;
  else if (act === "panel") { if (S.screen === "panel") S.screen = "done"; else S.panel = !S.panel; }
  else if (act === "meter") { S.panel = true; S.scope = "turn"; }
  else if (act === "scope-turn") S.scope = "turn"; else if (act === "scope-all") S.scope = "all";
  render();
});
addEventListener("resize", fit);
// a link opens a state
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in S) S[k] = typeof S[k] === "boolean" ? v === "1" || v === "true" : v;
render();
</script>
