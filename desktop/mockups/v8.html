// ── 7. the terminal: zen finished, drawn in a mono grid of 80 columns ─────────────────────────────────────────────
const W = 80;
const m = (s) => s.replace(/\{(\w+)\|([^{}]*)\}/g, '<span class="$1">$2</span>');   // {f|faint words}
const wid = (s) => [...s.replace(/<[^>]+>/g, "")].reduce((n, c) => n + (/[　-鿿＀-￯]/.test(c) ? 2 : 1), 0);
const pad = (s, n) => s + " ".repeat(Math.max(0, n - wid(s)));
const lr = (l, r = "", w = W) => l + " ".repeat(Math.max(1, w - wid(l) - wid(r))) + r;
const rl = (s) => `<span class="rule">${s}</span>`;
// one frame for every overlay: one border, the title on its left, a count on its right, the keys along the bottom
function frame(title, rows, foot, right = "", w = W) {
  const r = right ? ` <span class="f">${right}</span> ` : "";
  return [rl("┌ ") + `<span class="b">${title}</span> ` + rl("─".repeat(w - 5 - wid(title) - wid(r))) + r + rl("─┐"),
    ...rows.map((x) => rl("│") + pad(x, w - 2) + rl("│")),
    rl("└ ") + `<span class="f">${foot}</span> ` + rl("─".repeat(w - 5 - wid(foot))) + rl("─┘")];
}
const sel = (s, n) => `<span class="sel">${pad(s, n)}</span>`;
const HDR = lr(m("{fi|tazuna}"), m("Opus 5.5 {f|high}   {i2|≈$0}   {f|5h} 24%  {r|wk 93%}"));
const READY = m("{f|●} {m|ready}");
function tscreen(rows, left = m("{a|›} {fi|say something…}"), right = READY) {
  const body = rows.slice(0, 17); while (body.length < 17) body.push("");
  return [...body, rl("─".repeat(W)), lr(left, right)].join("\n");
}

    const mrow = (name, price, bench, aa) => " " + pad(m(name), 31) + pad(m(price), 15) + bench.padStart(5) + aa.padStart(5);
    const right = [m(" {f|model                          $/M in / out   bench   AA}"), mrow("Opus 5.5", "{f|plan}", "8.4", "58"), mrow("Sonnet 5.5", "{f|plan}", "", "54"), mrow("Haiku 5.5", "{f|plan}", "", "36"), mrow("Fable 5.2", "{f|plan}", "", ""),
      mrow("DeepSeek V4.1 Flash", "0.017 / 0.068", "", "32"), mrow("GPT-6.1 Sol", "0.038 / 0.19", "", "54"), mrow("Codestral 2508 {f|Mistral}", "0.3 / 0.9", "", ""), mrow("Mistral Medium 3.5 {f|Mistral}", "{g|free}", "", ""), mrow("ERNIE 5.5 Flash {f|OpenRouter}", "{g|free}", "", "")];
    const model = tscreen([HDR, "", ...frame("model", right.map((r, i) => pad(left[i] ?? "", 20) + rl("│") + r), "↑↓ providers   → its models   type to search   esc closes", "738 models")]);
    const usage = tscreen([HDR, "", ...frame("usage", [m(" {b|Claude plan}"), m("   5 hours   {a|━━━━━━━}{rule|━━━━━━━━━━━━━}   36% used   {f|resets in 2 h 12 min}"), m("   Week      {y|━━━━━━━━━━━━━━━━}{rule|━━━━}   79% used   {f|resets Sun 02:40}"), "",
      lr(m(" {b|SubRouter}"), m("$12.40 {f|left}  "), W - 2), "", m(" {b|The last 30 days}"), lr(m("   API providers    $0.41 {f|billed}"), m("{f|15 runs}  "), W - 2), lr(m("   Claude plan      $39.42 {f|at API prices, not billed}"), m("{f|75 runs}  "), W - 2), m("   From the cache   94% {f|of the input}")],
      "↑↓ scroll   esc closes")]);
    return `<div class="tp"><h2>The terminal, proposed: welcome and one overlay frame</h2><div class="lead">Drawn by hand in the terminal's palette, 80 columns. One frame for every overlay: one grey border, the title on its left, a count on its right, the keys along the bottom, the column's width.</div>
      <div class="tgrid">${cell("Welcome: the mark, the folder as ~/… with its branch, the hint; the model says itself once, in the header", welcome)}${cell("The / menu: a count, and a row when nothing matches", slash)}${cell("/model: the same frame; bench and AA as two columns; the provider in faint, not “, mistral”", model)}${cell("/usage: the same frame; every meter says “used”", usage)}</div></div>`;
  }
  if (isNow) return `<div class="tp"><h2>The terminal as it is: an answer and the status row</h2><div class="lead">Captured on 0.1.191. A table is a full grid with a blank row per row; a code block's background follows each line's length; zen's status is a bare word, and nothing says the view is scrolled up.</div>
    <div class="tgrid">${now("19-zen-streaming-table", "A table: a full grid, a blank row per row")}${now("19-zen-streaming-table", "A code block: a ragged background, no language", true)}${now("27-zen-auto-fold", "The status row while it works", true)}${designs}</div></div>`;
  const trow = (a, b, c) => " " + pad(m(a), 41) + pad(m(b), 28) + " ".repeat(Math.max(0, 9 - wid(m(c)))) + m(c);
  const table = tscreen([m(" {b|Files}"), "", trow("{f|File}", "{f|Change}", "{f|Lines}"), " " + rl("─".repeat(78)), trow("{cb|main.rs}", "greeting, second line", "{g|+2} {r|−1}"), trow("{cb|NOTES.md}", "new", "{g|+3}"),
    trow("{cb|a/very/long/path/that/keeps/going/and/}", "untouched, only here to", "0"), trow("{cb|going/src/components/SomethingVeryLong}", "test wrapping in a table", ""), trow("{cb|.tsx}", "cell", ""), "", m(" {b|Steps}"), "", " 1. Listed the folder", " 2. Edited the file", m("    • kept the {cb|fn main} signature")]);
  const cb = (s) => " " + `<span class="cb">${pad(m(s), 78)}</span>`;
  const code = tscreen([" 3. Wrote the notes", "", cb(" {f|rust}"), cb(" {k|fn} main() {"), cb("     println!({s|\"hello, tazuna\"}); {cm|// a comment that is long enough to run past}"), cb("         {cm|the right edge of a narrow terminal window}"), cb("     println!({s|\"second line\"});"), cb(" }"), "",
    m(" {a|▎} {i2|A quoted line: measure twice, cut once.}"), "", " " + rl("─".repeat(78)), "", m(" {g|☑} done item"), m(" {f|☐} open item")]);
  const pill = m("{pl| ↓ 40 lines }");
  const status = tscreen([HDR, "", m(" {i|The retry test fails on CI but passes locally. Can you find out why and fix it?}"), "", m(" {f|⌁ read 2 files, ran 1 command}   {f|12 s}"), "", " The test waits a fixed 100 ms for the second attempt, but the backoff starts", " at 80 ms with up to 25% jitter. On a slow CI runner the second attempt lands", " after the wait, so the assertion sees one call instead of two.", "",
    m(" {f|⌁ edited 1 file}   tests/retry.test.ts   {g|+9} {r|−3}"), "", m(" {i|Run the whole suite once more, then commit it.}"), "", m(" {f|⌁ ran 1 command}   git status --short   {f|0.1 s}"), "", " ".repeat(Math.floor((W - wid(pill)) / 2)) + pill],
    undefined, m("{a|⠹} Working 12 s {f|· esc stops}"));
  return `<div class="tp"><h2>The terminal, proposed: an answer and the status row</h2><div class="lead">Tables with one rule under the header, no grid and no blank rows; a code block as one even block with its language; the status row says what runs and how to stop it; a mark when the view is scrolled up.</div>
    <div class="tgrid">${cell("A table: a rule under its header, numbers to the right", table)}${cell("A code block: one even background, its language on the first row", code)}${cell("While it works: “Working 12 s · esc stops”, and “↓ 40 lines” when scrolled up", status)}${designs}</div></div>`;
}

// ── render ───────────────────────────────────────────────────────────────────────────────────────────────────────
const SCREENS = { start: "Start", thread: "Conversation", controls: "Controls", term1: "Terminal: overlays", term2: "Terminal: answers" };
const NOTES = {
  start: ["A: the mark at 44 px over the question and one line from your own run log (a click opens the usage page). No rival's start says what today cost.", "B: the mark as a watermark on the sheet, the last conversations as a list on the paper, no cards.", "Now: the question, two cards."],
  thread: ["Receipt A: one faint line under every answer, always there; a click unfolds the slip (every model call, what the cache saved). Click it.", "Receipt B: the same line only while the pointer is on the answer (as the numbers are today).", "“this chat $0.051” in the status bar opens the conversation's receipt (A and B).", "Work panel A: with nothing to show it folds to a tab on the sheet's edge; it opens by itself at the first change. B: it stays, as one line.", "Edges: the transcript fades under the header and over the box; today both cut rows in half.", "Dark depth (dark theme): the sheet against the desk is 1.08:1 today."],
  controls: ["One segmented control, one secondary button, one dialog shell (which also ends Settings being cut off in the smallest window)."],
  term1: ["The welcome: one model, a folder you can read, the branch.", "One overlay frame; a count; a row when nothing matches.", "“used” after every percentage, as on the usage page."],
  term2: ["Tables and code blocks drawn as the window draws them.", "A status row that says what runs; a scrolled-up mark.", "Designs: four today, or zen and cockpit."],
};
function fit() { const f = document.getElementById("frame"), st = f.parentElement; f.style.transform = `translate(-50%, -50%) scale(${Math.min(1, (st.clientWidth - 32) / 1280, (st.clientHeight - 32) / 800)})`; }
let Y = 96;
function render() {
  const pm = document.body.classList.contains("pmin");
  document.body.className = `${S.theme} paper ${S.theme === "dark" && S.depth !== "now" ? "d-" + S.depth : ""} ${pm ? "pmin" : ""}`;
  const f = document.getElementById("frame");
  f.innerHTML = { start: startScreen, thread: threadScreen, controls: controlsPage, term1: () => termPage(1), term2: () => termPage(2) }[S.screen]();
  const sc = document.getElementById("scroll");
  if (sc) { const sl = sc.querySelector(".slipw"); let y = 0; for (let el = sl; el && el !== sc; el = el.offsetParent) y += el.offsetTop; sc.scrollTop = sl ? Math.max(0, y + sl.offsetHeight - sc.clientHeight + 44) : Y; sc.onscroll = () => { Y = sc.scrollTop; }; }
  fit(); panel();
}
function panel() {
  const btn = (k, v, n) => `<button data-k="${k}" data-val="${v}" class="${String(S[k]) === String(v) ? "on" : ""}">${n}</button>`;
  const sw = (title, k, opts) => `<b>${title}</b><div class="opts">${opts.map(([v, n]) => btn(k, v, n)).join("")}</div>`;
  const win = S.screen === "start" || S.screen === "thread", term = S.screen.startsWith("term");
  document.getElementById("proto").innerHTML = `<span class="min" data-min>–</span>
    <b class="keep">Screen</b><div class="opts">${Object.entries(SCREENS).map(([k, v]) => btn("screen", k, v)).join("")}</div>
    ${sw("Theme", "theme", [["dark", "Dark"], ["light", "Light"]])}
    ${S.screen === "start" ? sw("Start screen", "start", [["a", "A: ledger, larger mark"], ["b", "B: watermark, quiet list"], ["now", "Now"]]) : ""}
    ${S.screen === "thread" ? sw("Receipt per answer", "receipt", [["a", "A: always there"], ["b", "B: on hover"], ["now", "Now"]]) + sw("Empty work panel", "panel", [["a", "A: folds to a tab"], ["b", "B: one line"], ["now", "Now"]]) + sw("Transcript edges", "edges", [["fade", "Fade"], ["cut", "Hard cut (now)"]]) : ""}
    ${win ? sw("Dark depth" + (S.theme === "dark" ? "" : " (dark theme only)"), "depth", [["lift", "Lifted sheet"], ["desk", "Darker desk"], ["now", "Now"]]) : ""}
    ${term ? sw("Version", "ver", [["new", "Proposed"], ["now", "Now"]]) : ""}
    ${S.screen === "term2" ? sw("Designs", "designs", [["two", "Two: zen, cockpit"], ["four", "Four (now)"]]) : ""}
    <b>What to look at</b><ol>${NOTES[S.screen].map((t) => `<li>${t}</li>`).join("")}</ol>`;
}
document.addEventListener("click", (e) => {
  const mn = e.target.closest("[data-min]"); if (mn) { document.getElementById("proto").classList.toggle("small"); document.body.classList.toggle("pmin"); fit(); return; }
  const o = e.target.closest("[data-open]"); if (o) { S.open = S.open === o.dataset.open ? "" : o.dataset.open; }
  const t = e.target.closest("[data-k]");
  if (t) { const v = t.dataset.val; S[t.dataset.k] = v === "true" ? true : v === "false" ? false : v; if (t.dataset.k === "panel") S.rail = false; if (t.dataset.k === "receipt") S.open = ""; }
  if (!o && !t) { if (!S.open || e.target.closest(".slipw")) return; S.open = ""; }
  location.hash = new URLSearchParams(Object.entries(S).map(([a, b]) => [a, String(b)])).toString();
  render();
});
addEventListener("resize", fit);
// a link opens a state: v8.html#screen=thread&receipt=a&open=r1&theme=light
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (k in S) S[k] = v === "true" ? true : v === "false" ? false : v;
render();
</script>
</body>
