[package]
name = "tazuna"
version = "0.1.223"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# gzip for models.dev's catalog: its built-in copy and the daily download (inflate only, ~17 KB of binary)
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
ratatui = "0.30.2"
# RSA signature checks for Sign in with ChatGPT's ID token (oauth.rs); already in the build under rustls (ureq), so it adds
# only the few functions used
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tachyonfx = "0.25.2"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

# the local time zone for /usage's resets ("Sat 3am"); already in the build through other crates
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
