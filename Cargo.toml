[package]
name = "tazuna"
version = "0.0.89"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tachyonfx = "0.25.2"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
