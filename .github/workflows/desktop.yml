# The desktop app (desktop/, docs/DESKTOP.md) for macOS, Linux and Windows, with the tazuna it carries built from the same
# commit (desktop/scripts/sidecar.mjs). A tag desktop-vX.Y.Z (the version in desktop/src-tauri/tauri.conf.json) makes a
# release with the installers; a run by hand (gh workflow run desktop.yml) or a pull request that touches the app builds
# them as artifacts only. Not signed yet: macOS and Windows warn on first open.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/**", ".github/workflows/desktop.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "tazuna desktop $v" --notes "The desktop app $v (docs/DESKTOP.md). Not signed yet: on macOS open it once, then System Settings, Privacy and Security, Open Anyway; on Windows SmartScreen shows More info, Run anyway."
  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          # Ubuntu 22.04: WebKitGTK 4.1 and an older glibc, so the packages run on older distributions too
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pinned to a commit, as in release.yml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.name }}
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: WebKitGTK and friends (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: build (the app and the tazuna it carries)
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx tauri build
      # the app opened once on each system: it must start the tazuna it carries (an app server for a chat) within 20 s
      - name: open the app (smoke)
        shell: bash
        run: |
          app=desktop/src-tauri/target/release/tazuna-desktop
          case "$RUNNER_OS" in
            # two tries on Linux: as is, then without WebKitGTK's DMA-BUF renderer (a blank page in VMs and on some GPUs)
            Linux) (xvfb-run -a "$app" > app.log 2>&1 &) ;;
            Windows) (./"$app.exe" > app.log 2>&1 &) ;;
            macOS) ("$app" > app.log 2>&1 &) ;;
          esac
          for i in $(seq 1 20); do
            if [ "$RUNNER_OS" = Windows ]; then
              tasklist //FI "IMAGENAME eq tazuna.exe" | grep -qi tazuna.exe && found=1
            else
              pgrep -f "tazuna app-server" > /dev/null && found=1
            fi
            [ -n "$found" ] && break
            sleep 1
          done
          if [ -z "$found" ] && [ "$RUNNER_OS" = Linux ]; then
            echo "not started as is; again with WEBKIT_DISABLE_DMABUF_RENDERER=1"
            pkill -f tazuna-desktop || true
            (WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a "$app" > app2.log 2>&1 &)
            for i in $(seq 1 30); do pgrep -f "tazuna app-server" > /dev/null && { found=dmabuf-off; break; }; sleep 1; done
            cat app2.log || true
          fi
          # diagnosis only, never in the app: WebKit's web-process sandbox off (bubblewrap may fail in a CI container)
          if [ -z "$found" ] && [ "$RUNNER_OS" = Linux ]; then
            echo "not started; again with WebKit's sandbox off (diagnosis)"
            pkill -f tazuna-desktop || true
            (WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a "$app" > app3.log 2>&1 &)
            for i in $(seq 1 30); do pgrep -f "tazuna app-server" > /dev/null && { found=sandbox-off; break; }; sleep 1; done
            cat app3.log || true
          fi
          cat app.log || true
          [ -n "$found" ] && echo "the app started its tazuna after ${i} s (${found})" || { echo "the app did not start its tazuna"; exit 1; }
      - name: collect the installers
        shell: bash
        run: |
          mkdir out
          b=desktop/src-tauri/target/release/bundle
          for f in "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage "$b"/msi/*.msi "$b"/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" out/
          done
          ls -la out
      - name: upload to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tazuna-desktop-${{ matrix.name }}
          path: out/
          retention-days: 7
