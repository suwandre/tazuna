# The desktop app (desktop/, docs/DESKTOP.md) for macOS, Linux and Windows, with the tazuna it carries built from the same
# commit (desktop/scripts/sidecar.mjs). A tag desktop-vX.Y.Z (the version in desktop/src-tauri/tauri.conf.json) makes a
# release with the installers; a run by hand (gh workflow run desktop.yml) or a pull request that touches the app builds
# them as artifacts only. Not code-signed: macOS and Windows warn on first open. A release's builds for the updater are
# signed with tazuna's updater key (secret TAURI_SIGNING_PRIVATE_KEY; its public half is in tauri.conf.json), and the last
# job writes latest.json onto the release and onto the desktop-latest release, which installed apps read.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/**", ".github/workflows/desktop.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "tazuna desktop $v" --notes "The desktop app $v (docs/DESKTOP.md). Not signed yet: on macOS open it once, then System Settings, Privacy and Security, Open Anyway; on Windows SmartScreen shows More info, Run anyway."
  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          # Ubuntu 22.04: WebKitGTK 4.1 and an older glibc, so the packages run on older distributions too
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pinned to a commit, as in release.yml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.name }}
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: WebKitGTK and friends (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # for the smoke only: software OpenGL (a runner has no GPU) and a screenshot tool
          sudo apt-get install -y libgl1-mesa-dri libegl1 imagemagick
      - name: build (the app and the tazuna it carries)
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          # a release also builds the signed update packages (.app.tar.gz, AppImage, setup .exe, each with its .sig)
          if [ "${{ github.event_name }}" = push ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build
          fi
      # the app opened once on each system: it must start the tazuna it carries (an app server for a chat) within 30 s.
      # Linux runs under Xvfb with software rendering (no GPU on a runner), WebKit's GPU compositing off, 24-bit colour.
      - name: open the app (smoke)
        shell: bash
        run: |
          app=desktop/src-tauri/target/release/tazuna-desktop
          case "$RUNNER_OS" in
            # a D-Bus session as a desktop has one (GTK and WebKit wait on it), software OpenGL, GPU compositing off
            Linux) (WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 dbus-run-session -- \
                     xvfb-run -a -s "-screen 0 1280x860x24" sh -c "\"$app\" & sleep 25; import -window root linux-shot.png; ps -eo pid,args | grep -i -E 'webkit|tazuna' | grep -v grep; sleep 600" > app.log 2>&1 &) ;;
            Windows) (./"$app.exe" > app.log 2>&1 &) ;;
            macOS) ("$app" > app.log 2>&1 &) ;;
          esac
          for i in $(seq 1 30); do
            if [ "$RUNNER_OS" = Windows ]; then
              tasklist //FI "IMAGENAME eq tazuna.exe" | grep -qi tazuna.exe && found=1
            else
              pgrep -f "tazuna app-server" > /dev/null && found=1
            fi
            [ -n "$found" ] && break
            sleep 1
          done
          sleep 2
          cat app.log || true
          [ -n "$found" ] && echo "the app started its tazuna after ${i} s" || { echo "the app did not start its tazuna"; exit 1; }
      - if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke
          path: linux-shot.png
          retention-days: 3
      - name: collect the installers
        shell: bash
        run: |
          mkdir out
          b=desktop/src-tauri/target/release/bundle
          for f in "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage "$b"/msi/*.msi "$b"/nsis/*.exe \
                   "$b"/macos/*.app.tar.gz "$b"/*/*.sig; do
            [ -f "$f" ] && cp "$f" out/
          done
          ls -la out
      - name: upload to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tazuna-desktop-${{ matrix.name }}
          path: out/
          retention-days: 7
  # the updater's manifest: each system's signed update package and its signature, on this release and on desktop-latest
  # (a prerelease that only holds latest.json, so it never shows as the repository's latest release, which is the CLI's)
  manifest:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir sig && gh release download "$tag" -p '*.sig' -D sig
          TAG="$tag" python3 - <<'PY'
          import datetime, glob, json, os
          tag, repo = os.environ["TAG"], os.environ["GH_REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}/"
          kinds = {".app.tar.gz": "darwin-aarch64", ".AppImage": "linux-x86_64", "-setup.exe": "windows-x86_64"}
          platforms = {}
          for sig in sorted(glob.glob("sig/*.sig")):
              name = os.path.basename(sig)[:-4]
              for end, key in kinds.items():
                  if name.endswith(end):
                      platforms[key] = {"signature": open(sig).read().strip(), "url": base + name}
          assert len(platforms) == 3, f"expected macOS, Linux and Windows update packages, got {sorted(platforms)}"
          v = tag.removeprefix("desktop-v")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump({"version": v, "notes": f"tazuna desktop {v}", "pub_date": now, "platforms": platforms}, open("latest.json", "w"), indent=1)
          print(open("latest.json").read())
          PY
          gh release upload "$tag" latest.json --clobber
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --prerelease --latest=false \
            --title "tazuna desktop: update manifest" --notes "Holds latest.json, which installed tazuna desktop apps read to find updates. The builds are on the desktop-v* releases."
          gh release upload desktop-latest latest.json --clobber
