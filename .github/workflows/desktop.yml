# The desktop app (desktop/, docs/DESKTOP.md) for macOS, Linux and Windows, with the tazuna it carries built from the same
# commit (desktop/scripts/sidecar.mjs). A tag desktop-vX.Y.Z (the version in desktop/src-tauri/tauri.conf.json) makes a
# release with the installers; a run by hand (gh workflow run desktop.yml) or a pull request that touches the app builds
# them as artifacts only. Not signed yet: macOS and Windows warn on first open.
name: desktop
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", "src/**", ".github/workflows/desktop.yml"]
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#desktop-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --prerelease \
            --title "tazuna desktop $v" --notes "The desktop app $v (docs/DESKTOP.md). Not signed yet: on macOS open it once, then System Settings, Privacy and Security, Open Anyway; on Windows SmartScreen shows More info, Run anyway."
  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          # Ubuntu 22.04: WebKitGTK 4.1 and an older glibc, so the packages run on older distributions too
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pinned to a commit, as in release.yml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.name }}
          workspaces: |
            . -> target
            desktop/src-tauri -> target
      - name: WebKitGTK and friends (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: build (the app and the tazuna it carries)
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npx tauri build
      - name: collect the installers
        shell: bash
        run: |
          mkdir out
          b=desktop/src-tauri/target/release/bundle
          for f in "$b"/dmg/*.dmg "$b"/deb/*.deb "$b"/rpm/*.rpm "$b"/appimage/*.AppImage "$b"/msi/*.msi "$b"/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" out/
          done
          ls -la out
      - name: upload to the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/*
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tazuna-desktop-${{ matrix.name }}
          path: out/
          retention-days: 7
