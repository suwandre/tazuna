# tazuna's build and tests on Windows (no Windows machine here; macOS cannot cross-compile ring without a Windows C
# toolchain). The release binary is kept for a week as the run's artifact: `gh run download -n tazuna-windows`.
name: windows
on:
  push:
    paths: ["src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  # Windows cannot check this repo out (892 bench files have a ':' in their name): Linux hands it the code
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src
            recordings
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: |
            src
            recordings
            Cargo.toml
            Cargo.lock
          retention-days: 1
  build:
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source
      - run: cargo build --release
      - run: cargo test
      - uses: actions/upload-artifact@v7
        with:
          name: tazuna-windows
          path: target/release/tazuna.exe
          retention-days: 7
