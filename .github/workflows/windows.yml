# tazuna's build and tests on Windows (no Windows machine here; macOS cannot cross-compile ring without a Windows C
# toolchain). The release binary is kept for a week as the run's artifact: `gh run download -n tazuna-windows`.
# By hand only since 2026-11-08 (`gh workflow run windows.yml`): on every push it used ~770 of a private repo's Actions
# minutes in eight days (64 runs, Windows counted double); each release now builds and tests on Windows (release.yml).
name: windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      # the whole repo: also checks that every path in it is valid on Windows
      - uses: actions/checkout@v7
      - run: cargo build --release
      - run: cargo test
      - uses: actions/upload-artifact@v7
        with:
          name: tazuna-windows
          path: target/release/tazuna.exe
          retention-days: 7
