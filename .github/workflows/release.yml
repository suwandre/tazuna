# A GitHub release per version tag (2026-11-08). ./release.sh tags the version in Cargo.toml, pushes the tag, builds the
# macOS (Apple silicon) archive on the Mac it runs on and uploads it; this workflow creates the release (notes: the
# version's CHANGELOG section) and adds Linux and Windows builds, tested on Windows first. macOS runners count 10x against
# a private repo's Actions minutes and the Mac is at hand, so CI builds no macOS. `tazuna upgrade` installs the newest.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: create the release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v " ") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "tazuna $v" > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "tazuna $v" --notes-file notes.md
  build:
    needs: release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pinned to a commit: a moved tag could otherwise run in a job that publishes release binaries
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release
      # the only Windows test run since windows.yml went manual (it ran on every push: ~6 minutes, counted double)
      - if: runner.os == 'Windows'
        run: cargo test
      - name: package and upload (Linux)
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C target/release -czf "tazuna-${{ matrix.target }}.tar.gz" tazuna
          gh release upload "$GITHUB_REF_NAME" "tazuna-${{ matrix.target }}.tar.gz"
      - name: package and upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path target/release/tazuna.exe -DestinationPath "tazuna-${{ matrix.target }}.zip"
          gh release upload "$env:GITHUB_REF_NAME" "tazuna-${{ matrix.target }}.zip"
