# A GitHub release per version tag (2026-11-08): `git tag v0.1.76 && git push origin v0.1.76` builds tazuna for macOS
# (Apple silicon), Linux and Windows, puts the archives on the release, and the version's CHANGELOG section as its notes.
# `tazuna upgrade` installs the newest; a live session says once a day when one is out (src/versions.rs).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: create the release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v " ") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "tazuna $v" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "tazuna $v" --notes-file notes.md
  build:
    needs: release
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: package and upload (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          tar -C target/release -czf "tazuna-${{ matrix.target }}.tar.gz" tazuna
          gh release upload "$GITHUB_REF_NAME" "tazuna-${{ matrix.target }}.tar.gz"
      - name: package and upload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/tazuna.exe -DestinationPath "tazuna-${{ matrix.target }}.zip"
          gh release upload "$env:GITHUB_REF_NAME" "tazuna-${{ matrix.target }}.zip"
